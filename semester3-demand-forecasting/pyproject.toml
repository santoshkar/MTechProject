[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecast"
version = "0.1.0"
description = "Semester 3 retail demand forecasting study using Walmart M5, LightGBM, and Chronos-2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting"]
dashboard = ["streamlit>=1.32", "openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
demand-forecast = "demand_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
